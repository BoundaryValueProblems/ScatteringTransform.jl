name: CI
on:
  push:
    branches:
      - master
      - main
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startswith(github.ref, 'refs/pull/') }}

env:
  JULIA_PKG_SERVER: ""
  # Fix for Windows: Forces GR/Plots to be headless
  JULIA_NUM_THREADS: 1
  JULIA_PKG_PRECOMPILE_AUTO: 0
  GKSwstype: "100"
  # Fix for macOS: Forces Matplotlib to use non-interactive backend
  MPLBACKEND: "Agg"
  # Force Julia to use Conda.jl
  PYTHON: ""

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
          - macOS-latest   # Apple Silicon (ARM64)
        arch:
          - x64
        exclude:
          - os: macOS-latest
            arch: x64
        include:
          - os: macOS-latest
            arch: aarch64
            version: '1.12'

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      # --- Custom Registry Configuration ---
      - name: Configure Git to use HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Add Registries
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.Registry.add(RegistrySpec(url="https://github.com/UCD4IDS/TetrapodsRegistry"))
      # -------------------------------------

      - uses: julia-actions/julia-buildpkg@v1

      - name: Add CUDA stack (Linux only)
        if: runner.os == 'Linux'
        run: julia --project=. -e 'using Pkg; Pkg.add(["CUDA", "cuDNN", "cuFFT"])'
      - name: Add Metal (macOS only)
        if: runner.os == 'macOS'
        run: julia --project=. -e 'using Pkg; Pkg.add("Metal")'
      - uses: julia-actions/julia-runtest@v1
        env:
          GROUP: ${{ runner.os == 'Linux' && 'CUDA' || runner.os == 'macOS' && 'Metal' || 'CPU' }}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
